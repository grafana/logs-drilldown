packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Three days in minutes (3 × 24 × 60).
minimumReleaseAge: 4320
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Exemptions for entries that cannot resolve to an attested version: each is a
# transitive dep whose parent range can't reach one. Pinned to exact versions so
# any new version has to be re-reviewed. Re-audit as these trees move.
trustPolicyExclude:
  - 'chokidar@4.0.3' # fork-ts-checker-webpack-plugin wants ^4; 4.0.3 is last 4.x (3.6.0 was attested)
  - 'react-redux@8.1.3 || 9.2.0' # @hello-pangea/dnd wants ^8 (8.1.2 attested) or ^9 via @grafana/ui
  - 'semver@6.3.1' # @babel/core (via jest tooling) wants ^6; 6.3.1 is last 6.x
  - 'ua-parser-js@1.0.41' # @grafana/faro-web-sdk pins this exact version
  - '@reduxjs/toolkit@2.10.1' # @grafana/api-clients pins this exact version
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

overrides:
  # Grafana externalizes React Router v6 until https://github.com/grafana/grafana/issues/129933 lands.
  # v6.30.6 has no package fix for GHSA-wrjc-x8rr-h8h6; this browser plugin only uses static internal routes.
  # GHSA-337j-9hxr-rhxg affects SSR hydration, which this browser plugin does not use.
  'react-router@^6': ^6.30.6
  js-cookie: ^3.0.7
  csv-parse: ^7.0.2
  basic-ftp: '^6.2.1'
