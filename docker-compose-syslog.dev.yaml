include:
  - path:
      - ${DRILLDOWN_GENERATOR_DIR:-../drilldown/packages/generator}/compose.yaml
      - ${DRILLDOWN_GENERATOR_DIR:-../drilldown/packages/generator}/compose.syslog.yaml

services:
  grafana:
    extends:
      file: docker-compose-defaults.yaml
      service: grafana
    container_name: 'grafana-logsapp'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall lokiLogsDataplane
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana}
